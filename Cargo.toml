[package]
name = "opendeck-galleon"
version = "0.1.0"
edition = "2024"
description = "OpenDeck device plugin for the Stream Deck built into the Corsair Galleon 100 SD keyboard"
license = "GPL-3.0-or-later"
repository = "https://github.com/shanelord01/opendeck-galleon"
publish = false

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libc = "0.2"
log = "0.4"
openaction = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
